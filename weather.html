<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>India Weather</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .hourly-scroll::-webkit-scrollbar { height: 6px; }
    .hourly-scroll::-webkit-scrollbar-thumb {
      background-color: rgba(156, 163, 175, 0.5);
      border-radius: 3px;
    }
  </style>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300 font-sans">
  <div class="min-h-full flex flex-col">
    <!-- Header -->
    <header class="sticky top-0 z-20 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700">
      <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-orange-400 to-green-600 flex items-center justify-center">
            <span class="text-white font-bold text-sm">IN</span>
          </div>
          <h1 class="text-lg font-bold">India Weather</h1>
        </div>
        <div class="flex items-center gap-2">
          <button id="unitToggle" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600">
            °C
          </button>
          <button id="themeToggle" class="p-2 rounded-lg bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600">
            <svg class="h-5 w-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg class="h-5 w-5 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-6 space-y-5">
      <!-- Search Box -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-4">
        <div class="flex gap-3">
          <div class="relative flex-1">
            <input
              id="cityInput"
              type="text"
              placeholder="Search city or state (e.g. Patna, Mumbai, Kerala)"
              class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-100 dark:bg-slate-700 border-0 focus:ring-2 focus:ring-orange-500 outline-none"
              autocomplete="off"
            />
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
          <button id="searchBtn" class="px-5 py-3 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-medium transition">
            Search
          </button>
          <button id="geoBtn" class="p-3 rounded-xl bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600" title="My Location">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>
        <p id="errorMsg" class="mt-3 text-sm text-red-500 hidden"></p>
        <p class="mt-2 text-xs text-slate-500 dark:text-slate-400">Demo mode • Search any major city, district or state in India</p>
      </div>

      <!-- Loading -->
      <div id="loading" class="hidden flex flex-col items-center py-16">
        <div class="w-10 h-10 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-3 text-slate-500">Loading weather...</p>
      </div>

      <!-- Weather Result -->
      <div id="weatherContent" class="hidden space-y-5">
        <!-- Current Weather -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-5">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 id="locationName" class="text-2xl font-bold"></h2>
              <p id="currentDate" class="text-slate-500 dark:text-slate-400 text-sm mt-1"></p>
            </div>
            <div class="flex items-center gap-4">
              <div id="weatherIcon" class="text-5xl"></div>
              <div>
                <div class="flex items-start">
                  <span id="currentTemp" class="text-5xl font-bold"></span>
                  <span id="tempUnit" class="text-xl mt-1 ml-1">°C</span>
                </div>
                <p id="weatherDesc" class="text-slate-600 dark:text-slate-300 capitalize"></p>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-6">
            <div class="bg-slate-100 dark:bg-slate-700/50 rounded-xl p-3 text-center">
              <p class="text-xs text-slate-500 uppercase">Feels like</p>
              <p id="feelsLike" class="font-semibold mt-1"></p>
            </div>
            <div class="bg-slate-100 dark:bg-slate-700/50 rounded-xl p-3 text-center">
              <p class="text-xs text-slate-500 uppercase">Humidity</p>
              <p id="humidity" class="font-semibold mt-1"></p>
            </div>
            <div class="bg-slate-100 dark:bg-slate-700/50 rounded-xl p-3 text-center">
              <p class="text-xs text-slate-500 uppercase">Wind</p>
              <p id="windSpeed" class="font-semibold mt-1"></p>
            </div>
            <div class="bg-slate-100 dark:bg-slate-700/50 rounded-xl p-3 text-center">
              <p class="text-xs text-slate-500 uppercase">UV Index</p>
              <p id="uvIndex" class="font-semibold mt-1"></p>
            </div>
          </div>
        </div>

        <!-- Hourly -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-5">
          <h3 class="font-semibold mb-4">Hourly Forecast</h3>
          <div id="hourlyForecast" class="flex gap-3 overflow-x-auto pb-1 hourly-scroll"></div>
        </div>

        <!-- Daily -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-5">
          <h3 class="font-semibold mb-4">5-Day Forecast</h3>
          <div id="dailyForecast" class="space-y-1"></div>
        </div>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="text-center py-16">
        <div class="text-5xl mb-4">🇮🇳</div>
        <h2 class="text-xl font-semibold text-slate-600 dark:text-slate-300">Search any place in India</h2>
        <p class="mt-2 text-slate-500 text-sm">Try: Patna, Mumbai, Delhi, Jaipur, Kerala, Guwahati...</p>
      </div>
    </main>
  </div>

  <script>
    // ======================
    // MOCK DATA - India
    // ======================
    const WEATHER = {
      patna: {
        name: "Patna", state: "Bihar",
        temp: 32, feels: 36, humidity: 70, wind: 11, uv: 7,
        desc: "hot & humid", icon: "☀️",
        hourly: [32, 33, 34, 33, 32, 29, 27, 26],
        daily: [[34,25], [35,26], [33,24], [32,23], [34,25]]
      },
      mumbai: {
        name: "Mumbai", state: "Maharashtra",
        temp: 31, feels: 36, humidity: 78, wind: 18, uv: 9,
        desc: "humid & partly cloudy", icon: "⛅",
        hourly: [31,32,33,32,31,30,29,28],
        daily: [[33,26],[34,27],[32,26],[31,25],[33,26]]
      },
      delhi: {
        name: "Delhi", state: "Delhi",
        temp: 34, feels: 37, humidity: 45, wind: 14, uv: 8,
        desc: "hot and hazy", icon: "☀️",
        hourly: [34,35,36,35,34,32,30,29],
        daily: [[36,25],[37,26],[35,24],[34,23],[36,25]]
      },
      bangalore: {
        name: "Bengaluru", state: "Karnataka",
        temp: 27, feels: 28, humidity: 65, wind: 12, uv: 7,
        desc: "pleasant & cloudy", icon: "⛅",
        hourly: [27,28,29,28,27,25,24,23],
        daily: [[29,20],[30,21],[28,19],[27,18],[29,20]]
      },
      hyderabad: {
        name: "Hyderabad", state: "Telangana",
        temp: 32, feels: 34, humidity: 55, wind: 15, uv: 8,
        desc: "sunny", icon: "☀️",
        hourly: [32,33,34,33,32,30,28,27],
        daily: [[34,24],[35,25],[33,23],[32,22],[34,24]]
      },
      chennai: {
        name: "Chennai", state: "Tamil Nadu",
        temp: 33, feels: 38, humidity: 72, wind: 16, uv: 9,
        desc: "hot & humid", icon: "☀️",
        hourly: [33,34,35,34,33,31,30,29],
        daily: [[35,27],[36,28],[34,26],[33,25],[35,27]]
      },
      kolkata: {
        name: "Kolkata", state: "West Bengal",
        temp: 30, feels: 35, humidity: 80, wind: 13, uv: 7,
        desc: "humid with clouds", icon: "⛅",
        hourly: [30,31,32,31,30,28,27,26],
        daily: [[32,25],[33,26],[31,24],[30,23],[32,25]]
      },
      jaipur: {
        name: "Jaipur", state: "Rajasthan",
        temp: 35, feels: 36, humidity: 30, wind: 20, uv: 9,
        desc: "hot and dry", icon: "☀️",
        hourly: [35,36,37,36,35,32,30,28],
        daily: [[37,24],[38,25],[36,23],[35,22],[37,24]]
      },
      lucknow: {
        name: "Lucknow", state: "Uttar Pradesh",
        temp: 33, feels: 36, humidity: 55, wind: 12, uv: 7,
        desc: "hot", icon: "☀️",
        hourly: [33,34,35,34,33,30,28,27],
        daily: [[35,24],[36,25],[34,23],[33,22],[35,24]]
      },
      ahmedabad: {
        name: "Ahmedabad", state: "Gujarat",
        temp: 36, feels: 38, humidity: 40, wind: 16, uv: 9,
        desc: "hot and dry", icon: "☀️",
        hourly: [36,37,38,37,36,33,30,29],
        daily: [[38,26],[39,27],[37,25],[36,24],[38,26]]
      },
      pune: {
        name: "Pune", state: "Maharashtra",
        temp: 28, feels: 29, humidity: 60, wind: 14, uv: 7,
        desc: "pleasant", icon: "⛅",
        hourly: [28,29,30,29,28,25,23,22],
        daily: [[30,20],[31,21],[29,19],[28,18],[30,20]]
      },
      kochi: {
        name: "Kochi", state: "Kerala",
        temp: 29, feels: 34, humidity: 85, wind: 12, uv: 8,
        desc: "humid with clouds", icon: "⛅",
        hourly: [29,30,31,30,29,28,27,26],
        daily: [[31,24],[32,25],[30,23],[29,22],[31,24]]
      },
      guwahati: {
        name: "Guwahati", state: "Assam",
        temp: 28, feels: 32, humidity: 82, wind: 10, uv: 6,
        desc: "humid with rain chance", icon: "🌧️",
        hourly: [28,29,30,29,28,26,25,24],
        daily: [[30,23],[31,24],[29,22],[28,21],[30,23]]
      },
      shimla: {
        name: "Shimla", state: "Himachal Pradesh",
        temp: 18, feels: 17, humidity: 65, wind: 8, uv: 5,
        desc: "cool & cloudy", icon: "☁️",
        hourly: [18,19,20,19,18,16,14,13],
        daily: [[20,10],[21,11],[19,9],[18,8],[20,10]]
      },
      srinagar: {
        name: "Srinagar", state: "Jammu & Kashmir",
        temp: 16, feels: 15, humidity: 70, wind: 9, uv: 4,
        desc: "cool", icon: "⛅",
        hourly: [16,17,18,17,16,14,12,11],
        daily: [[18,8],[19,9],[17,7],[16,6],[18,8]]
      },
      // States
      bihar: {
        name: "Bihar", state: "State",
        temp: 32, feels: 36, humidity: 70, wind: 11, uv: 7,
        desc: "hot & humid", icon: "☀️",
        hourly: [32,33,34,33,32,29,26,25],
        daily: [[34,24],[35,25],[33,23],[32,22],[34,24]]
      },
      kerala: {
        name: "Kerala", state: "State",
        temp: 29, feels: 34, humidity: 82, wind: 12, uv: 8,
        desc: "humid & rainy", icon: "🌧️",
        hourly: [29,30,31,30,29,27,26,25],
        daily: [[31,24],[32,25],[30,23],[29,22],[31,24]]
      },
      rajasthan: {
        name: "Rajasthan", state: "State",
        temp: 36, feels: 37, humidity: 25, wind: 18, uv: 9,
        desc: "hot and dry", icon: "☀️",
        hourly: [36,37,38,37,36,32,29,28],
        daily: [[38,25],[39,26],[37,24],[36,23],[38,25]]
      },
      maharashtra: {
        name: "Maharashtra", state: "State",
        temp: 30, feels: 33, humidity: 65, wind: 15, uv: 7,
        desc: "varies across state", icon: "⛅",
        hourly: [30,31,32,31,30,28,26,25],
        daily: [[32,23],[33,24],[31,22],[30,21],[32,23]]
      },
      "tamil nadu": {
        name: "Tamil Nadu", state: "State",
        temp: 32, feels: 36, humidity: 70, wind: 14, uv: 8,
        desc: "hot & humid", icon: "☀️",
        hourly: [32,33,34,33,32,29,27,26],
        daily: [[34,25],[35,26],[33,24],[32,23],[34,25]]
      },
      "uttar pradesh": {
        name: "Uttar Pradesh", state: "State",
        temp: 33, feels: 36, humidity: 55, wind: 12, uv: 7,
        desc: "hot", icon: "☀️",
        hourly: [33,34,35,34,33,30,27,26],
        daily: [[35,24],[36,25],[34,23],[33,22],[35,24]]
      }
    };

    // ======================
    // APP LOGIC
    // ======================
    let isCelsius = true;
    let currentData = null;

    const cityInput = document.getElementById('cityInput');
    const searchBtn = document.getElementById('searchBtn');
    const geoBtn = document.getElementById('geoBtn');
    const errorMsg = document.getElementById('errorMsg');
    const loading = document.getElementById('loading');
    const weatherContent = document.getElementById('weatherContent');
    const emptyState = document.getElementById('emptyState');
    const unitToggle = document.getElementById('unitToggle');
    const themeToggle = document.getElementById('themeToggle');

    // Theme
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
    themeToggle.onclick = () => {
      document.documentElement.classList.toggle('dark');
      localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    };

    // Unit Toggle
    unitToggle.onclick = () => {
      isCelsius = !isCelsius;
      unitToggle.textContent = isCelsius ? '°C' : '°F';
      if (currentData) showWeather(currentData);
    };

    function toF(c) { return Math.round(c * 9/5 + 32); }
    function temp(c) { return isCelsius ? Math.round(c) : toF(c); }
    function unit() { return isCelsius ? '°C' : '°F'; }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.remove('hidden');
    }
    function hideError() {
      errorMsg.classList.add('hidden');
    }

    function showWeather(data) {
      currentData = data;
      hideError();

      document.getElementById('locationName').textContent = data.state === 'State' ? data.name : `${data.name}, ${data.state}`;
      document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-IN', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
      document.getElementById('currentTemp').textContent = temp(data.temp);
      document.getElementById('tempUnit').textContent = unit();
      document.getElementById('weatherDesc').textContent = data.desc;
      document.getElementById('weatherIcon').textContent = data.icon;
      document.getElementById('feelsLike').textContent = temp(data.feels) + unit();
      document.getElementById('humidity').textContent = data.humidity + '%';
      document.getElementById('windSpeed').textContent = data.wind + ' km/h';
      document.getElementById('uvIndex').textContent = data.uv;

      // Hourly
      const hours = ['Now','1PM','2PM','3PM','4PM','5PM','6PM','7PM'];
      const hourlyBox = document.getElementById('hourlyForecast');
      hourlyBox.innerHTML = '';
      data.hourly.forEach((t, i) => {
        hourlyBox.innerHTML += `
          <div class="flex-shrink-0 w-16 bg-slate-100 dark:bg-slate-700/50 rounded-xl p-2 text-center">
            <p class="text-xs text-slate-500">${hours[i]}</p>
            <div class="text-xl my-1">${data.icon}</div>
            <p class="font-semibold text-sm">${temp(t)}°</p>
          </div>`;
      });

      // Daily
      const days = ['Today','Tue','Wed','Thu','Fri'];
      const dailyBox = document.getElementById('dailyForecast');
      dailyBox.innerHTML = '';
      data.daily.forEach((d, i) => {
        dailyBox.innerHTML += `
          <div class="flex items-center justify-between py-2.5 px-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700/40">
            <span class="w-14 font-medium">${days[i]}</span>
            <span class="text-xl">${data.icon}</span>
            <div class="flex gap-4 text-sm">
              <span class="font-semibold w-8 text-right">${temp(d[0])}°</span>
              <span class="text-slate-500 w-8">${temp(d[1])}°</span>
            </div>
          </div>`;
      });

      weatherContent.classList.remove('hidden');
      emptyState.classList.add('hidden');
      loading.classList.add('hidden');
    }

    function search() {
      const q = cityInput.value.trim().toLowerCase();
      if (!q) {
        showError('Please enter a city or state name');
        return;
      }

      hideError();
      loading.classList.remove('hidden');
      weatherContent.classList.add('hidden');
      emptyState.classList.add('hidden');

      setTimeout(() => {
        // Exact match
        let data = WEATHER[q];

        // Partial match
        if (!data) {
          const key = Object.keys(WEATHER).find(k => k.includes(q) || q.includes(k));
          if (key) data = WEATHER[key];
        }

        if (data) {
          showWeather(data);
        } else {
          loading.classList.add('hidden');
          emptyState.classList.remove('hidden');
          showError(`"${cityInput.value}" not found. Try Patna, Mumbai, Delhi, Jaipur, Kerala...`);
        }
      }, 500);
    }

    // Events
    searchBtn.onclick = search;
    cityInput.onkeydown = (e) => { if (e.key === 'Enter') search(); };

    geoBtn.onclick = () => {
      cityInput.value = 'Delhi';
      search();
    };

    // Auto focus
    cityInput.focus();
  </script>
</body>
</html>
