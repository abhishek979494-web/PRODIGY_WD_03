<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #1a1a20;
      --surface-hover: #24242c;
      --border: #2e2e38;
      --text: #f0f0f5;
      --text-muted: #8a8a9a;
      --accent: #6c5ce7;
      --accent-hover: #7f71f0;
      --operator: #2d2d38;
      --operator-hover: #3a3a48;
      --equals: #6c5ce7;
      --equals-hover: #7f71f0;
      --danger: #e74c3c;
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      --radius: 20px;
      --radius-btn: 14px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: var(--text);
      padding: 20px;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(108, 92, 231, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(108, 92, 231, 0.06) 0%, transparent 50%);
    }

    .calculator {
      width: 100%;
      max-width: 340px;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .display {
      background: var(--bg);
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 20px;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .expression {
      font-size: 0.95rem;
      color: var(--text-muted);
      min-height: 1.4em;
      word-break: break-all;
      text-align: right;
      transition: opacity 0.2s ease;
    }

    .result {
      font-size: 2.6rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.2;
      word-break: break-all;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .result.pop {
      animation: pop 0.25s ease;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      appearance: none;
      border: none;
      font-family: inherit;
      font-size: 1.35rem;
      font-weight: 500;
      height: 64px;
      border-radius: var(--radius-btn);
      cursor: pointer;
      color: var(--text);
      background: var(--surface-hover);
      transition:
        background 0.15s ease,
        transform 0.1s ease,
        box-shadow 0.15s ease;
      position: relative;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.12) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    button:hover {
      background: #2e2e38;
    }

    button:active {
      transform: scale(0.96);
    }

    button:active::after {
      opacity: 1;
    }

    button.operator {
      background: var(--operator);
      color: var(--accent);
      font-size: 1.5rem;
    }

    button.operator:hover {
      background: var(--operator-hover);
    }

    button.equals {
      background: var(--equals);
      color: #fff;
      grid-column: span 2;
    }

    button.equals:hover {
      background: var(--equals-hover);
    }

    button.clear {
      color: var(--danger);
    }

    button.clear:hover {
      background: rgba(231, 76, 60, 0.15);
    }

    button.zero {
      grid-column: span 2;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (max-width: 380px) {
      .calculator {
        padding: 18px;
      }
      button {
        height: 56px;
        font-size: 1.2rem;
      }
      .result {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="keys">
      <button class="clear" data-action="clear">AC</button>
      <button class="operator" data-action="sign">±</button>
      <button class="operator" data-action="percent">%</button>
      <button class="operator" data-action="operator" data-value="/">÷</button>

      <button data-action="number" data-value="7">7</button>
      <button data-action="number" data-value="8">8</button>
      <button data-action="number" data-value="9">9</button>
      <button class="operator" data-action="operator" data-value="*">×</button>

      <button data-action="number" data-value="4">4</button>
      <button data-action="number" data-value="5">5</button>
      <button data-action="number" data-value="6">6</button>
      <button class="operator" data-action="operator" data-value="-">−</button>

      <button data-action="number" data-value="1">1</button>
      <button data-action="number" data-value="2">2</button>
      <button data-action="number" data-value="3">3</button>
      <button class="operator" data-action="operator" data-value="+">+</button>

      <button class="zero" data-action="number" data-value="0">0</button>
      <button data-action="decimal">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>
  </div>

  <script>
    const expressionEl = document.getElementById("expression");
    const resultEl = document.getElementById("result");

    let current = "0";
    let previous = null;
    let operator = null;
    let shouldReset = false;

    function formatNumber(num) {
      if (num === "" || num === "-") return num;
      const n = parseFloat(num);
      if (isNaN(n)) return "0";
      // Avoid scientific notation for reasonable numbers
      if (Math.abs(n) >= 1e12 || (Math.abs(n) < 1e-6 && n !== 0)) {
        return n.toExponential(6);
      }
      // Limit decimal places for display
      const str = n.toString();
      if (str.includes("e")) return str;
      const parts = str.split(".");
      if (parts[1] && parts[1].length > 8) {
        return parseFloat(n.toFixed(8)).toString();
      }
      return str;
    }

    function updateDisplay() {
      resultEl.textContent = formatNumber(current);
      if (previous !== null && operator) {
        const opSymbol = { "+": "+", "-": "−", "*": "×", "/": "÷" }[operator] || operator;
        expressionEl.textContent = `${formatNumber(previous)} ${opSymbol}`;
      } else {
        expressionEl.textContent = "";
      }
    }

    function animateResult() {
      resultEl.classList.remove("pop");
      void resultEl.offsetWidth; // reflow
      resultEl.classList.add("pop");
    }

    function inputNumber(value) {
      if (shouldReset) {
        current = value;
        shouldReset = false;
      } else {
        if (current === "0" && value !== ".") {
          current = value;
        } else if (current.length < 14) {
          current += value;
        }
      }
      updateDisplay();
    }

    function inputDecimal() {
      if (shouldReset) {
        current = "0.";
        shouldReset = false;
      } else if (!current.includes(".")) {
        current += ".";
      }
      updateDisplay();
    }

    function setOperator(op) {
      if (operator && previous !== null && !shouldReset) {
        calculate();
      }
      previous = current;
      operator = op;
      shouldReset = true;
      updateDisplay();
    }

    function calculate() {
      if (operator === null || previous === null) return;

      const a = parseFloat(previous);
      const b = parseFloat(current);
      let result;

      switch (operator) {
        case "+":
          result = a + b;
          break;
        case "-":
          result = a - b;
          break;
        case "*":
          result = a * b;
          break;
        case "/":
          result = b === 0 ? "Error" : a / b;
          break;
        default:
          return;
      }

      if (result === "Error") {
        current = "Error";
        previous = null;
        operator = null;
      } else {
        current = String(result);
        previous = null;
        operator = null;
      }
      shouldReset = true;
      updateDisplay();
      animateResult();
    }

    function clearAll() {
      current = "0";
      previous = null;
      operator = null;
      shouldReset = false;
      updateDisplay();
    }

    function toggleSign() {
      if (current === "0" || current === "Error") return;
      current = current.startsWith("-") ? current.slice(1) : "-" + current;
      updateDisplay();
    }

    function percent() {
      if (current === "Error") return;
      const n = parseFloat(current) / 100;
      current = String(n);
      updateDisplay();
      animateResult();
    }

    document.querySelector(".keys").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;

      const action = btn.dataset.action;
      const value = btn.dataset.value;

      switch (action) {
        case "number":
          if (current === "Error") clearAll();
          inputNumber(value);
          break;
        case "decimal":
          if (current === "Error") clearAll();
          inputDecimal();
          break;
        case "operator":
          if (current === "Error") return;
          setOperator(value);
          break;
        case "equals":
          calculate();
          break;
        case "clear":
          clearAll();
          break;
        case "sign":
          toggleSign();
          break;
        case "percent":
          percent();
          break;
      }
    });

    // Keyboard support
    document.addEventListener("keydown", (e) => {
      if (e.key >= "0" && e.key <= "9") {
        if (current === "Error") clearAll();
        inputNumber(e.key);
      } else if (e.key === ".") {
        if (current === "Error") clearAll();
        inputDecimal();
      } else if (e.key === "+" || e.key === "-") {
        if (current !== "Error") setOperator(e.key);
      } else if (e.key === "*") {
        if (current !== "Error") setOperator("*");
      } else if (e.key === "/") {
        e.preventDefault();
        if (current !== "Error") setOperator("/");
      } else if (e.key === "Enter" || e.key === "=") {
        e.preventDefault();
        calculate();
      } else if (e.key === "Escape" || e.key === "c" || e.key === "C") {
        clearAll();
      } else if (e.key === "Backspace") {
        if (shouldReset || current === "Error") {
          clearAll();
        } else if (current.length > 1) {
          current = current.slice(0, -1);
          updateDisplay();
        } else {
          current = "0";
          updateDisplay();
        }
      } else if (e.key === "%") {
        percent();
      }
    });

    updateDisplay();
  </script>
</body>
</html>
